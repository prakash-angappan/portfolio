<!DOCTYPE html>
<html>

<head>

<title>About | Prakash Angappan</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="../assets/css/main.css">

<style>

/* ---------- PAGE ---------- */
html{
overflow-x:hidden;
width:100%;
}
body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
overflow-x:hidden;
}

/* ---------- CONTAINER (IVORY GLASS PANEL) ---------- */

.container{

width:92%;
max-width:1300px;

margin:auto;
/*margin-top:90px;
margin-bottom:60px;*/

padding:40px 60px;

position:relative;

background:rgba(255,255,240,0.08);

border-radius:22px;

backdrop-filter:blur(3px);

box-shadow:
0 0 40px rgba(0,0,0,.35),
0 0 120px rgba(0,0,0,.25);

text-align:center;

}

.container::before{

content:"";

position:absolute;

inset:0;

border-radius:22px;

border:1px solid rgba(120,200,255,.25);

pointer-events:none;

}

/* ---------- NAV ---------- */

.top-nav{
position:fixed;
top:20px;
left:0;
width:100%;
display:flex;
justify-content:center;
z-index:100;
}

.nav-inner{

display:flex;
gap:34px;

padding:10px 28px;
flex-wrap:nowrap;
border-radius:30px;

background:rgba(40,80,160,0.25);

backdrop-filter:blur(12px);

border:1px solid rgba(120,180,255,.35);

box-shadow:
0 0 10px rgba(120,180,255,.25),
0 0 20px rgba(60,120,255,.15);

}

.nav-inner a{
color:#F5F5DC;
text-decoration:none;
font-weight:600;
letter-spacing:.4px;
display:inline-block;
transition:transform .18s ease;
-webkit-tap-highlight-color: transparent;
}

.nav-inner a::before,
.nav-inner a::after{
color:#F5F5DC;
opacity:0;
transition:opacity .18s ease;
}

.nav-inner a::before{content:"[";margin-right:4px;}
.nav-inner a::after{content:"]";margin-left:4px;}

.nav-inner a:hover{
transform:scale(1.08);
}

.nav-inner a:hover::before,
.nav-inner a:hover::after{
opacity:1;
}

.nav-inner a.active::before,
.nav-inner a.active::after{
opacity:1;
}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.78);
z-index:-3;
}

.aurora-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-2;

background:
radial-gradient(circle at 20% 30%, rgba(80,140,255,0.12), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(120,200,255,0.10), transparent 45%),
radial-gradient(circle at 60% 20%, rgba(70,120,255,0.08), transparent 40%);

filter:blur(60px);
}

/* ---------- TITLE ---------- */

h1{

text-align:center;

font-size:46px;

font-weight:800;

color:#F5F5DC;
margin-top:30px;
margin-bottom:20px;

letter-spacing:2px;

/* glow */

text-shadow:
0 0 6px rgba(255,255,255,.25),
0 0 18px rgba(120,180,255,.25);

}
/ * About */ 
#about-content{

display:flex;

flex-direction:column;

align-items:center;

text-align:center;

}
/* ---------- SECTIONS ---------- */
.section{

margin-top:32px;

text-align:center;

max-width:900px;

margin-left:auto;
margin-right:auto;

}

.section h2{
color:#F5F5DC;
margin-bottom:10px;
font-size:22px;
}

.section p{
line-height:1.7;
opacity:.9;
max-width:900px;
margin:auto;
}

.section h2::after{

content:"";

display:block;

width:140px;
height:2px;

margin:12px auto 18px;

background:linear-gradient(
90deg,
transparent,
rgba(120,180,255,.9),
transparent
);

box-shadow:
0 0 8px rgba(120,180,255,.7),
0 0 18px rgba(120,180,255,.4);

}

/* ---------- HOBBIES + GAMES ---------- */

.two-columns{

display:flex;

flex-direction:column;

align-items:center;

gap:0;

margin-top:0;

width:100%;

}

#hobbies,
#games{

list-style:none;

display:flex;

flex-wrap:wrap;

justify-content:center;
align-items:center;
gap:12px 18px;

margin-top:12px;

padding-left:0;

}

#games{
max-width:900px;
}

#hobbies li,
#games li{
max-width:90%;
text-align:center;
padding:8px 16px;
background:rgba(255,255,255,0.14);
border-radius:22px;
border:1px solid rgba(140,200,255,.6);
color:#F5F5DC;
font-size:14px;

white-space:normal;
word-break:break-word;

-webkit-tap-highlight-color: transparent;
}

#hobbies li:hover,
#games li:hover{

transform:translateY(-2px) scale(1.04);

box-shadow:
0 0 10px rgba(120,180,255,.6),
0 0 20px rgba(120,180,255,.3);

}

/* ---------- TABLET ---------- */

@media (max-width:1024px){

.container{
padding:40px 30px;
}

.two-columns{
grid-template-columns:1fr;
gap:30px;
}

}

/* ---------- MOBILE ---------- */

@media (max-width:768px)
{
.container{
width:96%;
max-width:96%;
margin:0 auto;
padding:35px 16px;
}

h1{
font-size:32px;
}

.section{
margin-top:26px;
}

.section h2{
font-size:20px;
}

.section p{
font-size:14px;
}

.nav-inner{
gap:18px;
padding:10px 18px;

}

}

/* ---------- FOOTER ---------- */

.site-footer{
text-align:center;
padding:30px 0;
font-size:14px;
color:#cfcfcf;
opacity:.75;
margin-top:50px;
}

.site-footer a{
color:#7ec7ff;
text-decoration:none;
}

.site-footer a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="/">Home</a>
<a href="/projects/">Featured Projects</a>
<a href="/about/" class="active">About Me</a>
</div>
</nav>

<div class="page-bg"></div>
<div class="page-overlay"></div>
<div class="aurora-bg"></div>

<div class="container">

<h1>About Me</h1>
<div class="section-divider"></div>

<div id="about-content"></div>

<div class="two-columns">

<div class="section">
<h2>Hobbies</h2>
<div class="section-divider"></div>
<ul id="hobbies"></ul>
</div>

<div class="section">
<h2>Favorite Games</h2>
<div class="section-divider"></div>
<ul id="games"></ul>
</div>

</div>

</div>

<footer class="site-footer">
© 2026 Prakash Angappan • Base template:
<a href="https://html5up.net" target="_blank">HTML5 UP</a>
</footer>

<script>

async function loadAbout(){

const res = await fetch("about.json?v=" + Date.now());
const data = await res.json();

const container = document.getElementById("about-content");

let html = "";

data.sections.forEach(section=>{
html += `
<div class="section">
<h2>${section.title}</h2>
<div class="section-divider"></div>
<p>${section.text}</p>
</div>
`;
});

container.innerHTML = html;

const hobbies = document.getElementById("hobbies");

if(data.hobbies){
data.hobbies.forEach(h=>{
hobbies.innerHTML += `<li>${h}</li>`;
});
}

const games = document.getElementById("games");

if(data.favorite_games){
data.favorite_games.forEach(g=>{
games.innerHTML += `<li>${g}</li>`;
});
}

}

loadAbout();

</script>

</body>
</html>
