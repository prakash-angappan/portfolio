<!DOCTYPE html>

<html>

<head>

<title>Prakash Angappan | Game Developer</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="../assets/css/main.css">

<style>

/* ---------- PAGE ---------- */

body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
overflow-x:hidden;
}

/* ---------- NAVIGATION ---------- */

.top-nav{
position:fixed;
top:20px;
left:0;
width:100%;
display:flex;
justify-content:center;
z-index:100;
}

.nav-inner{
display:flex;
gap:34px;
padding:10px 28px;
border-radius:30px;

background:rgba(40,80,160,0.25);
backdrop-filter:blur(12px);

border:1px solid rgba(120,180,255,.35);

box-shadow:
0 0 10px rgba(120,180,255,.25),
0 0 20px rgba(60,120,255,.15);
}

.nav-inner a{
color:#F5F5DC;
text-decoration:none;
font-weight:600;
letter-spacing:.4px;
position:relative;
display:inline-block;
transition:transform .18s ease;
}

.nav-inner a::before,
.nav-inner a::after{
color:#F5F5DC;
opacity:0;
transition:opacity .18s ease;
}

.nav-inner a::before{content:"[";margin-right:4px;}
.nav-inner a::after{content:"]";margin-left:4px;}

.nav-inner a:hover{transform:scale(1.08);}

.nav-inner a:hover::before,
.nav-inner a:hover::after{opacity:1;}

.nav-inner a.active::before,
.nav-inner a.active::after{opacity:1;}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.78);
z-index:-3;
}

.aurora-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-2;

background:
radial-gradient(circle at 20% 30%, rgba(80,140,255,0.12), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(120,200,255,0.10), transparent 45%),
radial-gradient(circle at 60% 20%, rgba(70,120,255,0.08), transparent 40%);

filter:blur(60px);
}

/* ---------- HERO LAYOUT ---------- */

.hero{

display:flex;

align-items:center;

justify-content:center;

gap:80px;

margin-top:40px;
margin-bottom:40px;

}

/* photo */

.hero-photo img{
width:320px;
height:320px;
border-radius:50%;
object-fit:cover;

border:2px solid rgba(120,180,255,.7);

box-shadow:
0 0 12px rgba(120,180,255,.7),
0 0 28px rgba(120,180,255,.35);
}

/* hero text */

.hero-content{
text-align:left;
max-width:720px;
}

.hero h1{

font-size:46px;

font-weight:800;

color:#F5F5DC;

letter-spacing:1px;

text-shadow:
0 0 8px rgba(255,255,255,.4),
0 0 25px rgba(120,180,255,.45);

margin-bottom:4px;

}
.hero p{

margin-top:8px;

margin-bottom:10px;

}


/* ---------- ACTIONS ---------- */


.hero-actions{

display:flex;
align-items:center;
gap:10px;

flex-wrap:nowrap;

margin-top:6px;

}

/* icon buttons */
.hero-card{

background:#f3efe4;

border-radius:8px;

padding:4px 12px 4px 6px;

display:inline-flex;
align-items:center;
gap:8px;

font-weight:600;
font-size:13px;

color:#1a1a1a !important;   /* lock text color */

text-decoration:none;

box-shadow:0 6px 14px rgba(0,0,0,.35);

transition:
transform .22s ease,
box-shadow .22s ease;

transform-origin:center;

}

.hero-card img{

width:16px;
height:16px;

object-fit:contain;

}

.hero-card img{

width:24px;
height:24px;

object-fit:contain;

}

.hero-card:hover{

transform:scale(1.08);

color:#1a1a1a !important;   /* keep text black */

box-shadow:
0 0 10px rgba(0,170,255,.8),
0 0 22px rgba(0,170,255,.45),
0 10px 24px rgba(0,0,0,.45);

}

/* ---------- CONTACT ---------- */

.hero-contact{
display:flex;
align-items:center;
gap:10px;
margin-left:10px;
font-size:18px;
color:#F5F5DC;
}

.contact-icon{
width:28px;
height:28px;
}

.contact-divider{
color:#7ec7ff;
opacity:.7;
}

.contact-item{
display:flex;
align-items:center;
gap:8px;
}

/* ---------- STATS ---------- */

.stats{

display:flex;

gap:80px;

margin-top:20px;

}
.stat{
text-align:left;
}

.stat h3{

color:#8fd3ff;

font-weight:600;

letter-spacing:.4px;

}

.big-number{
font-size:30px;
}

/* ---------- TECH GRID ---------- */

.tech-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:50px;
text-align:center;
margin-bottom:80px;
}

.tech-grid h3{color:#F5F5DC;}

.section-divider{
width:140px;
height:2px;
margin:8px auto 14px auto;

background:linear-gradient(
90deg,
transparent,
rgba(120,180,255,.9),
transparent
);
}

/* icons */

.badges{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:18px;
}

.badges img{
width:54px;
height:54px;
background:white;
border-radius:6px;
padding:6px;
object-fit:contain;
}

/* leadership */

.leadership-grid{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-top:20px;
justify-content:center;
}

.leader-chip{
padding:7px 14px;
background:rgba(255,255,255,0.14);
border-radius:20px;
border:1px solid rgba(140,200,255,.6);
color:#F5F5DC;
font-size:14px;
}

.leadership-title{
margin-top:45px;
text-align:center;
color:#F5F5DC;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width:1024px){

.hero{
gap:40px;
}

.hero-photo img{
width:200px;
height:200px;
}

}

@media (max-width:768px){

.hero{
flex-direction:column;
text-align:center;
}

.hero-content{
text-align:center;
}

.hero-actions{
justify-content:center;
flex-wrap:wrap;
}

.hero-contact{
margin-left:0;
justify-content:center;
}

.stats{
flex-wrap:wrap;
gap:30px;
}

.tech-grid{
grid-template-columns:1fr;
gap:40px;
}

}

#platforms{

display:flex;

justify-content:center;

flex-wrap:nowrap;

gap:18px;

}
</style>

</head>

<body>

<nav class="top-nav">

<div class="nav-inner">
<a href="/" class="active">Home</a>
<a href="/projects/">Projects</a>
<a href="/about/">About Me</a>
</div>

</nav>

<div class="page-bg"></div>
<div class="page-overlay"></div>
<div class="aurora-bg"></div>

<div class="container">

<div class="hero">

<div class="hero-photo">
<img src="../images/profile.jpg" alt="Prakash Angappan">
</div>

<div class="hero-content">

<h1 id="hero-name"></h1>
<p id="hero-tagline"></p>

<div class="hero-actions">

<a href="../PrakashAngappan-Resume.pdf" class="hero-card" download>
<img src="../images/icons/resume.png">
Resume
</a>

<a href="https://www.linkedin.com/in/prakash-angappan-91b0819/" target="_blank" class="hero-card">
<img src="../images/icons/linkedin.png">
Linkedin
</a>

<div class="hero-contact">

<span class="contact-item">
<img src="../images/icons/email.png" class="contact-icon">
aprakash.mca@gmail.com
</span>

<span class="contact-divider">|</span>

<span class="contact-item">
<img src="../images/icons/phone.png" class="contact-icon">
+91 9900370190
</span>

</div>

</div>

<div class="stats" id="stats"></div>
</div>

</div>

<div class="tech-grid">

<div>
<h3>Platforms</h3>
<div class="section-divider"></div>
<div class="badges" id="platforms"></div>
</div>

<div>
<h3>Game Engines</h3>
<div class="section-divider"></div>
<div class="badges" id="engines"></div>
</div>

<div>
<h3>Languages</h3>
<div class="section-divider"></div>
<div class="badges" id="languages"></div>
</div>

</div>

<h2 class="leadership-title">
Leadership & Production
</h2>

<div class="section-divider"></div>

<div class="leadership-grid" id="leadership"></div>

</div>

<script>

/* load json */

async function loadHome(){

const res=await fetch("home.json?v="+Date.now())
const data=await res.json()

document.getElementById("hero-name").innerText=data.hero.name
document.getElementById("hero-tagline").innerText=data.hero.tagline

const stats=document.getElementById("stats")

data.stats.forEach(s=>{
stats.innerHTML+=`
<div class="stat">
<h3>${s.title}</h3>
<div class="big-number">${s.value}</div>
</div>`
})

data.tech_stack.platforms.icons.forEach(p=>{
document.getElementById("platforms").innerHTML+=
`<img src="../${p.icon}?v=1">`
})

data.tech_stack.engines.icons.forEach(e=>{
document.getElementById("engines").innerHTML+=
`<img src="../${e.icon}?v=1">`
})

data.tech_stack.languages.icons.forEach(l=>{
document.getElementById("languages").innerHTML+=
`<img src="../${l.icon}?v=1">`
})

data.leadership.forEach(skill=>{
document.getElementById("leadership").innerHTML+=
`<div class="leader-chip">${skill}</div>`
})

}

loadHome()

</script>

</body>
</html>
