<!doctype html>
<html>
  <head>

  <body>
    <div id="nav"></div>

      <div class="hero-left">

            <div class="stat-number">15+</div>

    <section class="container">

      <div class="projects-grid">
        <a class="project-card" href="projects.html#radiant-dark">

          <img src="images/placeholders/project2.jpg" />

          <img src="images/placeholders/project3.jpg" />

    <section class="container">
      <h2>Leadership</h2>

      <div class="leadership-grid" id="leadership"></div>
    </section>

    <footer class="site-footer">© 2026 Prakash Angappan</footer>

    <script src="js/main.js"></script>
  </body>
