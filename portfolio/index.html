<!DOCTYPE html>
<html>

<head>

<title>Prakash Angappan | Game Developer</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="assets/css/main.css">

<style>

.big-number{
font-size:36px;
font-weight:700;
color:#7ec7ff;
margin-top:10px;
}

.hero{
text-align:center;
margin-bottom:60px;
}

.hero h1{
font-size:48px;
margin-bottom:10px;
}

.hero p{
opacity:.85;
font-size:18px;
}

</style>

</head>

<body>

<nav class="top-nav">
<a href="/">Home</a>
<a href="/projects/">Projects</a>
<a href="/about/">About</a>
<a href="/hobbies/">Hobbies</a>
<a href="/favorite-games/">Favorite Games</a>
<a href="/contact/">Contact</a>
</nav>

<!-- SAME BACKGROUND AS PROJECTS PAGE -->

<div class="page-bg"></div>
<div class="page-overlay"></div>
<div class="aurora-bg"></div>

<div class="bg-particles">
<span style="left:10%;animation-duration:30s;"></span>
<span style="left:25%;animation-duration:36s;"></span>
<span style="left:40%;animation-duration:28s;"></span>
<span style="left:60%;animation-duration:34s;"></span>
<span style="left:75%;animation-duration:32s;"></span>
<span style="left:90%;animation-duration:38s;"></span>
</div>

<div class="cursor-glow"></div>

<div class="container">

<!-- HERO -->

<div class="hero">

<h1 id="hero-name"></h1>
<p id="hero-tagline"></p>

</div>

<!-- STATS -->

<div class="grid" id="stats"></div>

<!-- TECH STACK -->

<div class="grid">

<div class="card">

<h3>Platforms</h3>
<div class="badges" id="platforms"></div>

</div>

<div class="card">

<h3>Game Engines</h3>
<div class="badges" id="engines"></div>

</div>

<div class="card">

<h3>Languages</h3>
<div class="badges" id="languages"></div>

</div>

</div>

<!-- LEADERSHIP -->

<h2 style="margin-top:60px;">Leadership & Production</h2>

<div class="leadership-grid" id="leadership"></div>

</div>

<script>

async function loadHome(){

const res = await fetch("home.json?v=" + Date.now())
const data = await res.json()

/* hero */

document.getElementById("hero-name").innerText = data.hero.name
document.getElementById("hero-tagline").innerText = data.hero.tagline

/* stats */

const stats = document.getElementById("stats")

data.stats.forEach(s=>{

stats.innerHTML += `
<div class="card highlight">
<h3>${s.title}</h3>
<div class="big-number">${s.value}</div>
</div>
`

})

/* platforms */

data.tech_stack.platforms.forEach(p=>{

document.getElementById("platforms").innerHTML +=
`<img src="${p.icon}" loading="lazy">`

})

/* engines */

data.tech_stack.engines.forEach(e=>{

document.getElementById("engines").innerHTML +=
`<img src="${e.icon}" loading="lazy">`

})

/* languages */

data.tech_stack.languages.forEach(l=>{

document.getElementById("languages").innerHTML +=
`<img src="${l.icon}" loading="lazy">`

})

/* leadership */

data.leadership.forEach(skill=>{

document.getElementById("leadership").innerHTML +=
`<div class="leader-chip">${skill}</div>`

})

}

loadHome()

</script>

</body>
</html>
