<style>

/* ---------- PAGE ---------- */

body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
overflow-x:hidden;
}

/* ---------- NAVIGATION ---------- */

.top-nav{
position:fixed;
top:20px;
left:0;
width:100%;
display:flex;
justify-content:center;
z-index:100;
}

.nav-inner{

display:flex;
gap:34px;
padding:10px 28px;

border-radius:30px;

background:rgba(40,80,160,0.25);
backdrop-filter:blur(12px);

border:1px solid rgba(120,180,255,.35);

box-shadow:
0 0 10px rgba(120,180,255,.25),
0 0 20px rgba(60,120,255,.15);

}

.nav-inner a{
color:#F5F5DC;
text-decoration:none;
font-weight:600;
letter-spacing:.4px;
position:relative;
display:inline-block;
transition:transform .18s ease;
}

.nav-inner a::before,
.nav-inner a::after{
color:#F5F5DC;
opacity:0;
transition:opacity .18s ease;
}

.nav-inner a::before{
content:"[";
margin-right:4px;
}

.nav-inner a::after{
content:"]";
margin-left:4px;
}

.nav-inner a:hover{
transform:scale(1.08);
}

.nav-inner a:hover::before,
.nav-inner a:hover::after{
opacity:1;
}

.nav-inner a.active::before,
.nav-inner a.active::after{
opacity:1;
}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.78);
z-index:-3;
}

/* ---------- AURORA ---------- */

.aurora-bg{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-2;

background:
radial-gradient(circle at 20% 30%, rgba(80,140,255,0.12), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(120,200,255,0.10), transparent 45%),
radial-gradient(circle at 60% 20%, rgba(70,120,255,0.08), transparent 40%);

filter:blur(60px);

}

/* ---------- PARTICLES ---------- */

.bg-particles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-1;
overflow:hidden;
}

.bg-particles span{

position:absolute;

width:4px;
height:4px;

background:rgba(220,235,255,0.85);

border-radius:50%;

box-shadow:
0 0 6px rgba(120,180,255,.8),
0 0 14px rgba(120,180,255,.5);

animation:particleFloat linear infinite;

}

@keyframes particleFloat{

0%{ transform:translateY(110vh); opacity:0; }
10%{ opacity:.7; }
90%{ opacity:.7; }
100%{ transform:translateY(-10vh); opacity:0; }

}

/* ---------- CURSOR GLOW ---------- */

.cursor-glow{

position:fixed;

width:18px;
height:18px;

border-radius:50%;

pointer-events:none;

background:#000;

transform:translate(-50%,-50%);

z-index:9999;

border:2px solid rgba(90,170,255,.9);

box-shadow:
0 0 8px rgba(90,170,255,.8),
0 0 18px rgba(90,170,255,.6),
0 0 30px rgba(90,170,255,.35);

}

/* ---------- HERO ---------- */

letter-spacing:1px;

text-shadow:
0 0 8px rgba(255,255,255,.4),

margin-bottom:20px;

.hero p{

opacity:.95;

font-size:24px;

letter-spacing:0.5px;

margin-top:4px;

text-shadow:
0 0 4px rgba(255,255,255,.25),
0 0 12px rgba(120,180,255,.25);

}

/* ---------- BUTTON ROW ---------- */

/* ---------- HERO CARD BUTTONS ---------- */
/* ---------- HERO ACTION ROW ---------- */

.hero-actions{

justify-content:center;
align-items:center;

margin-top:14px;

/* ---------- HERO BUTTON ---------- */
.hero-card{

background:#f3efe4;

border-radius:10px;

padding:6px 10px;
width:36px
height:36px;

display:flex;
align-items:center;
justify-content:flex-start;   /* stop centering */

padding-left:6px;            /* move icon inside left */
gap:8px;

font-weight:500;
font-size:18px;

color:#1a1a1a !important;

text-decoration:none;

box-shadow:0 8px 20px rgba(0,0,0,.35);

position:relative;
overflow:hidden;

/* smooth animation */

transform:translateZ(0);
will-change:transform;

transition:
transform .20s ease-out,
box-shadow .20s ease-out;
transform:translateX(-4px); /* moves icon slightly left */
}
.hero-card:hover{

transform:translate3d(0,-2px,0) scale(1.05);

box-shadow:
0 0 10px rgba(0,170,255,.9),
0 0 25px rgba(0,170,255,.55),
0 0 45px rgba(0,170,255,.35),
0 15px 35px rgba(0,0,0,.65);

color:#1a1a1a !important;

}

.hero-card:hover,
.hero-card:focus,
.hero-card:active{

font-weight:500;

text-decoration:none;

}
/* ---------- CONTACT ---------- */

.hero-contact{

display:flex;
align-items:center;
gap:10px;

margin-left:10px;

font-size:18px;

color:#F5F5DC;

}

.contact-icon{

/* ---------- STATS ---------- */

.stats{

/* ---------- TECH GRID ---------- */

/* ---------- ICON BADGES ---------- */

justify-content:center;

}

.badges img{

width:54px;
height:54px;

background:white;

border-radius:6px;

padding:6px;

/* ---------- LEADERSHIP ---------- */

justify-content:center;

flex-wrap:nowrap;   /* prevents icons from moving to next line */

gap:18px;

<script>

/* cursor glow */

const cursor=document.querySelector(".cursor-glow")

let mouseX=0
let mouseY=0
let posX=0
let posY=0

document.addEventListener("mousemove",e=>{
mouseX=e.clientX
mouseY=e.clientY
})

function animateCursor(){

posX+=(mouseX-posX)*0.15
posY+=(mouseY-posY)*0.15

cursor.style.left=posX+"px"
cursor.style.top=posY+"px"

requestAnimationFrame(animateCursor)

}

animateCursor()

/* load json */

async function loadHome(){

const res=await fetch("home.json?v="+Date.now())
const data=await res.json()

document.getElementById("hero-name").innerText=data.hero.name
document.getElementById("hero-tagline").innerText=data.hero.tagline

const stats=document.getElementById("stats")

data.stats.forEach(s=>{
stats.innerHTML+=`
<div class="stat">
<h3>${s.title}</h3>
<div class="big-number">${s.value}</div>
</div>`
})

data.tech_stack.platforms.icons.forEach(p=>{
document.getElementById("platforms").innerHTML+=
`<img src="../${p.icon}?v=1">`
})

data.tech_stack.engines.icons.forEach(e=>{
document.getElementById("engines").innerHTML+=
`<img src="../${e.icon}?v=1">`
})

data.tech_stack.languages.icons.forEach(l=>{
document.getElementById("languages").innerHTML+=
`<img src="../${l.icon}?v=1">`
})

data.leadership.forEach(skill=>{
document.getElementById("leadership").innerHTML+=
`<div class="leader-chip">${skill}</div>`
})

}

loadHome()

</script>
