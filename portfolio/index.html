<!DOCTYPE html>
<html>

<head>

<title>Prakash Angappan | Game Developer</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="assets/css/main.css">

<style>

/* HERO */

.hero{
text-align:center;
margin-bottom:70px;
}

.hero h1{
font-size:48px;
margin-bottom:10px;
color:#F5F5DC;
}

.hero p{
opacity:.9;
font-size:18px;
}

/* STATS */

.big-number{
font-size:36px;
font-weight:700;
color:#7ec7ff;
margin-top:10px;
}

/* ICON BADGES */

.badges{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin-top:10px;
}

.badges img{

width:36px;
height:36px;

background:white;

border-radius:6px;

padding:4px;

box-shadow:
0 0 6px rgba(120,180,255,.6);

transition:transform .2s ease;

}

.badges img:hover{
transform:scale(1.08);
}

/* LEADERSHIP */

.leadership-grid{

display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
justify-content:center;

}

.leader-chip{

padding:8px 14px;

background:rgba(255,255,255,0.1);

border-radius:20px;

font-size:14px;

backdrop-filter:blur(6px);

border:1px solid rgba(120,180,255,.4);

}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:25px;
}

</style>

</head>

<body>

<nav class="top-nav">
<a href="/">Home</a>
<a href="/projects/">Projects</a>
<a href="/about/">About</a>
<a href="/hobbies/">Hobbies</a>
<a href="/favorite-games/">Favorite Games</a>
<a href="/contact/">Contact</a>
</nav>

<!-- SAME BACKGROUND -->

<div class="page-bg"></div>
<div class="page-overlay"></div>
<div class="aurora-bg"></div>

<div class="bg-particles">
<span style="left:10%;animation-duration:30s;"></span>
<span style="left:25%;animation-duration:36s;"></span>
<span style="left:40%;animation-duration:28s;"></span>
<span style="left:60%;animation-duration:34s;"></span>
<span style="left:75%;animation-duration:32s;"></span>
<span style="left:90%;animation-duration:38s;"></span>
</div>

<div class="cursor-glow"></div>

<div class="container">

<!-- HERO -->

<div class="hero">

<h1 id="hero-name"></h1>
<p id="hero-tagline"></p>

</div>

<!-- STATS -->

<div class="grid" id="stats"></div>

<!-- TECH STACK -->

<div class="grid" style="margin-top:40px;">

<div class="card">

<h3>Platforms</h3>
<div class="badges" id="platforms"></div>

</div>

<div class="card">

<h3>Game Engines</h3>
<div class="badges" id="engines"></div>

</div>

<div class="card">

<h3>Languages</h3>
<div class="badges" id="languages"></div>

</div>

</div>

<!-- LEADERSHIP -->

<h2 style="margin-top:70px;text-align:center;">Leadership & Production</h2>

<div class="leadership-grid" id="leadership"></div>

</div>

<script>

async function loadHome(){

const res = await fetch("home.json?v=" + Date.now())
const data = await res.json()

/* HERO */

document.getElementById("hero-name").innerText = data.hero.name
document.getElementById("hero-tagline").innerText = data.hero.tagline

/* STATS */

const stats = document.getElementById("stats")

data.stats.forEach(s=>{

const card = document.createElement("div")
card.className="card highlight"

card.innerHTML=`
<h3>${s.title}</h3>
<div class="big-number">${s.value}</div>
`

stats.appendChild(card)

})

/* PLATFORMS */

data.tech_stack.platforms.forEach(p=>{

document.getElementById("platforms").innerHTML +=
`<img src="${p.icon}?v=1" loading="lazy">`

})

/* ENGINES */

data.tech_stack.engines.forEach(e=>{

document.getElementById("engines").innerHTML +=
`<img src="${e.icon}?v=1" loading="lazy">`

})

/* LANGUAGES */

data.tech_stack.languages.forEach(l=>{

document.getElementById("languages").innerHTML +=
`<img src="${l.icon}?v=1" loading="lazy">`

})

/* LEADERSHIP */

data.leadership.forEach(skill=>{

document.getElementById("leadership").innerHTML +=
`<div class="leader-chip">${skill}</div>`

})

}

loadHome()

</script>

</body>
</html>
