<!DOCTYPE html>
<html>

<head>

<title>Prakash Angappan | Game Developer</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="../assets/css/main.css">

<style>

/* ---------- PAGE ---------- */

body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
overflow-x:hidden;
width:100%;
}

html{
width:100%;
overflow-x:hidden;
}

.page-bg,
.page-overlay,
.aurora-bg{
max-width:100vw;
}
/* ---------- CONTAINER ---------- */

.container{

width:92%;
max-width:1300px;
margin:auto;
padding:40px 60px;

position:relative;

background:rgba(255,255,240,0.08);

border-radius:22px;

backdrop-filter:blur(3px);

box-shadow:
0 0 40px rgba(0,0,0,.35),
0 0 120px rgba(0,0,0,.25);

text-align:center;

}

.container::before{

content:"";

position:absolute;

inset:0;

border-radius:22px;

border:1px solid rgba(120,200,255,.25);

pointer-events:none;

}

/* ---------- NAVIGATION ---------- */
/* ---------- NAVIGATION ---------- */

.top-nav{
position:fixed;
top:20px;
left:0;
width:100%;
display:flex;
justify-content:center;
z-index:100;
padding:0 10px;
}

.nav-inner{
display:flex;
gap:34px;
padding:10px 28px;
border-radius:30px;

background:rgba(40,80,160,0.25);
backdrop-filter:blur(12px);

border:1px solid rgba(120,180,255,.35);

box-shadow:
0 0 10px rgba(120,180,255,.25),
0 0 20px rgba(60,120,255,.15);

flex-wrap:nowrap;
justify-content:center;
}


.nav-inner a{
color:#F5F5DC;
text-decoration:none;
font-weight:600;
letter-spacing:.4px;
position:relative;
display:inline-block;
transition:transform .18s ease;
-webkit-tap-highlight-color: transparent;
}

.nav-inner a:visited,
.nav-inner a:active,
.nav-inner a:focus{
color:#F5F5DC;
text-decoration:none;
}


/* bracket hover animation */

.nav-inner a::before,
.nav-inner a::after{
color:#F5F5DC;
opacity:0;
transition:opacity .18s ease;
}

.nav-inner a::before{
content:"[";
margin-right:4px;
}

.nav-inner a::after{
content:"]";
margin-left:4px;
}

.nav-inner a:hover{
transform:scale(1.08);
}

.nav-inner a:hover::before,
.nav-inner a:hover::after{
opacity:1;
}

.nav-inner a.active::before,
.nav-inner a.active::after{
opacity:1;
}

.nav-inner a:active{
background:transparent;
}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.78);
z-index:-3;
}

.aurora-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-2;

background:
radial-gradient(circle at 20% 30%, rgba(80,140,255,0.12), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(120,200,255,0.10), transparent 45%),
radial-gradient(circle at 60% 20%, rgba(70,120,255,0.08), transparent 40%);

filter:blur(60px);
}

/* ---------- HERO LAYOUT ---------- */

.hero{
display:flex;
align-items:center;
justify-content:center;
gap:80px;
margin-top:40px;
margin-bottom:40px;
flex-wrap:nowrap; /* keep desktop layout */
}

/* photo */

.hero-photo{
position:relative;
}

.hero-photo::before{

content:"";
position:absolute;

width:360px;
height:360px;

border-radius:50%;

background:
radial-gradient(circle,
rgba(80,180,220,.35) 0%,
rgba(80,180,220,.15) 40%,
transparent 70%);

filter:blur(20px);
z-index:-1;

}

.hero-photo img{

width:320px;
height:320px;

border-radius:50%;

object-fit:cover;
object-position:center 15%;

box-shadow:
0 0 25px rgba(80,180,220,.8),
0 0 70px rgba(80,180,220,.45),
0 30px 80px rgba(0,0,0,.55);

}

/* hero text */

.hero-content{
text-align:left;
max-width:720px;
}

.hero h1{

font-size:clamp(34px,4vw,46px);

font-weight:800;

color:#F5F5DC;

letter-spacing:1px;

text-shadow:
0 0 8px rgba(255,255,255,.4),
0 0 25px rgba(120,180,255,.45);

margin-bottom:4px;

}

.hero p{
margin-top:8px;
margin-bottom:10px;
}

/* ---------- ACTIONS ---------- */

.hero-actions{

display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;

margin-top:14px;   /* increase from ~6px */
}

/* icon buttons */
.hero-card{

background:#f3efe4;

border-radius:10px;

padding:2px 7px 2px 7px;   /* reduced padding */


display:inline-flex;
align-items:center;
gap:6px;                    /* reduced gap between icon and text */

font-weight:600;
font-size:16px;

color:#1a1a1a !important;
text-decoration:none;

box-shadow:0 6px 14px rgba(0,0,0,.35);

transform:translateZ(0) scale(1);      /* stable base transform */
transform-origin:center;

will-change:transform;                 /* smoother GPU animation */

transition:
transform .22s cubic-bezier(.25,.8,.25,1),
box-shadow .22s ease;

color:#1a1a1a !important;
-webkit-tap-highlight-color: transparent;

}

.hero-card:visited,
.hero-card:active,
.hero-card:focus{
color:#1a1a1a !important;
text-decoration:none;
}

.hero-card img{

width:24px;
height:24px;

object-fit:contain;

}

.hero-card:hover{

transform:translateZ(0) scale(1.08);

color:#1a1a1a !important;

box-shadow:
0 0 12px rgba(0,170,255,.9),
0 0 26px rgba(0,170,255,.55),
0 10px 24px rgba(0,0,0,.45);

}

/* ---------- CONTACT ---------- */

.hero-contact{
display:flex;
align-items:center;
gap:10px;
margin-left:10px;
font-size:18px;
color:#F5F5DC;
flex-wrap:wrap;
}

.contact-icon{
width:28px;
height:28px;
}

.contact-divider{
color:#7ec7ff;
opacity:.7;
}

.contact-item{
display:flex;
align-items:center;
gap:8px;
}

/* ---------- STATS ---------- */

.stats{
display:flex;
gap:80px;
margin-top:20px;
flex-wrap:wrap;
}

.stat{
text-align:left;
}

.stat h3{
color:#8fd3ff;
font-weight:600;
letter-spacing:.4px;
}

.big-number{
font-size:30px;
}

/* ---------- TECH GRID ---------- */

.tech-grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:50px;
text-align:center;
margin-bottom:80px;
}

.badges{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:18px;
}

.badges img{

width:54px;
height:54px;

background:white;
border-radius:6px;
padding:6px;

object-fit:contain;

box-shadow:
0 0 10px rgba(120,180,255,.5),
0 0 20px rgba(120,180,255,.25);

transition:transform .2s ease, box-shadow .2s ease;

}

.tech-grid h3{
color:#F5F5DC;
margin-bottom:4px;   /* reduce default spacing */
}
/* Leadership */

.leadership-grid{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:18px;
justify-content:center;
}

.leader-chip{
display:inline-flex;
align-items:center;

padding:5px 12px;          /* smaller padding */
border-radius:16px;

background:rgba(255,255,255,0.14);
border:1px solid rgba(140,200,255,.6);

color:#F5F5DC;
font-size:14px;
white-space:nowrap;       /* prevents breaking */

width:auto;               /* size only based on text */
}

.leadership-title{
margin-top:45px;
margin-bottom:4px;   /* reduce gap */
text-align:center;
color:#F5F5DC;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width:1024px){

.hero{
gap:40px;
}

.hero-photo img{
width:220px;
height:220px;
}

.tech-grid{
grid-template-columns:repeat(2,1fr);
}

}

@media (max-width:768px){

.container{
width:96%;
max-width:96%;
margin:0 auto;
padding:30px 16px;
}

.nav-inner{
gap:18px;
padding:10px 18px;
}
.hero{
flex-direction:column; /* stack only on mobile */
text-align:center;
gap:30px;
}

.hero-content{
text-align:center;
}

.hero-photo img{
width:160px;
height:160px;
}

.hero-actions{
justify-content:center;
}

.hero-contact{
margin-left:0;
justify-content:center;
}

.stats{
justify-content:center;
gap:30px;
}

.tech-grid{
grid-template-columns:1fr;
gap:40px;
}

#platforms{
display:flex;
justify-content:center;
flex-wrap:nowrap;
gap:18px;
}

#platforms{
flex-wrap:wrap;
}

box-shadow:
0 0 6px rgba(120,180,255,.9),
0 0 16px rgba(120,180,255,.55);

}

/* Section Divider */
.section-divider{

width:140px;
height:2px;

margin:2px auto 12px auto;   /* closer to title */

background:linear-gradient(
90deg,
transparent,
rgba(120,180,255,.9),
transparent
);

</style>

</head>

<body>

<nav class="top-nav">

<div class="nav-inner">
<a href="/" class="active">Home</a>
<a href="/projects/">Featured Projects</a>
<a href="/about/">About Me</a>
</div>

</nav>

<div class="page-bg"></div>
<div class="page-overlay"></div>
<div class="aurora-bg"></div>

<div class="container">

<div class="hero">

<div class="hero-photo">
<img src="../images/profile.jpg" alt="Prakash Angappan">
</div>

<div class="hero-content">

<h1 id="hero-name"></h1>
<p id="hero-tagline"></p>

<div class="hero-actions">

<a href="../PrakashAngappan-Resume.pdf" class="hero-card" download>
<img src="../images/icons/resume.png">
Resume
</a>

<a href="https://www.linkedin.com/in/prakash-angappan-91b0819/" target="_blank" class="hero-card">
<img src="../images/icons/linkedin.png">
Linkedin
</a>

<div class="hero-contact">

<span class="contact-item">
<img src="../images/icons/email.png" class="contact-icon">
aprakash.mca@gmail.com
</span>

<span class="contact-divider">|</span>

<span class="contact-item">
<img src="../images/icons/phone.png" class="contact-icon">
+91 9900370190
</span>

</div>

</div>

<div class="stats" id="stats"></div>
</div>

</div>

<div class="tech-grid">

<div>
<h3>Platforms</h3>
<div class="section-divider"></div>

</div>

<div>
<h3>Game Engines</h3>
<div class="section-divider"></div>
<div class="badges" id="engines"></div>
</div>

<div>
<h3>Languages</h3>
<div class="section-divider"></div>

Leadership & Production

<script>

async function loadHome(){

const res=await fetch("home.json?v="+Date.now())
const data=await res.json()

document.getElementById("hero-name").innerText=data.hero.name
document.getElementById("hero-tagline").innerText=data.hero.tagline

const stats=document.getElementById("stats")

data.stats.forEach(s=>{
stats.innerHTML+=`
<div class="stat">
<h3>${s.title}</h3>
<div class="big-number">${s.value}</div>
</div>`
})

data.tech_stack.platforms.icons.forEach(p=>{
document.getElementById("platforms").innerHTML+=
`<img src="../${p.icon}?v=1">`
})

data.tech_stack.engines.icons.forEach(e=>{
document.getElementById("engines").innerHTML+=
`<img src="../${e.icon}?v=1">`
})

data.tech_stack.languages.icons.forEach(l=>{
document.getElementById("languages").innerHTML+=
`<img src="../${l.icon}?v=1">`
})

data.leadership.forEach(skill=>{
document.getElementById("leadership").innerHTML+=
`<div class="leader-chip">${skill}</div>`
})

}

loadHome()

</script>

</body>
</html>
