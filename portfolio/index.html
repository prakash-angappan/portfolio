<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prakash Angappan | Engineering Manager | Game Development</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay">
      <span class="accent">⬢</span> Loading Systems...
    </div>

    <div class="main-bg"></div>

    <nav class="top-nav">
      <div class="nav-links">
        <button class="nav-btn active" id="btn-home" onclick="showPage('home')">
          Home
        </button>
        <button
          class="nav-btn"
          id="btn-projects"
          onclick="showPage('projects')"
        >
          Projects
        </button>
        <button class="nav-btn" onclick="goToContact()">Contact</button>
      </div>
    </nav>

    <div class="container">
      <section id="home" class="page-section">
        <div class="hero">
          <div class="hero-text">
            <h1 id="hero-name"></h1>
            <p id="hero-title"></p>
            <p id="hero-summary"></p>
            <div id="hero-stats" class="stats"></div>
          </div>
          <img id="hero-img" class="profile-img" src="" alt="Profile" />
        </div>

        <div class="section-divider" style="margin-top: 25px">
          <h2>TECHNICAL EXPERTISE</h2>
        </div>
        <div
          id="tech-grid"
          class="grid tech-grid"
          style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px"
        ></div>

        <div class="section-divider" style="margin-top: 40px">
          <h2>Featured Projects</h2>
        </div>
        <div id="featured-grid" class="featured-grid"></div>

        <div class="section-divider" style="margin-top: 40px">
          <h2>Leadership & Production</h2>
        </div>
        <div id="management-grid" class="skills-grid"></div>

        <div
          id="contact"
          style="margin-top: 40px; padding-bottom: 40px; text-align: center"
        >
          <div class="section-divider">
            <h2>Let's Connect</h2>
          </div>
          <div
            class="glass-card"
            style="
              padding: 30px;
              margin-top: 30px;
              display: flex;
              flex-direction: column;
              align-items: center;
            "
          >
            <p
              id="contact-intro"
              style="
                color: var(--muted);
                margin-bottom: 25px;
                font-size: 1.1rem;
              "
            ></p>
            <div
              id="action-row"
              class="action-row"
              style="
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
              "
            ></div>
          </div>
        </div>
      </section>

      <section id="projects" class="page-section" style="display: none">
        <div class="section-divider">
          <h2>Shipped Titles</h2>
        </div>
        <div id="timeline-container"></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
