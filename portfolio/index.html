<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prakash Angappan | Engineering Manager | Game Development</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:,">
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay">
      <span class="accent">⬢</span> Loading Systems...
    </div>

    <div class="main-bg"></div>

    <nav class="top-nav">
      <div class="nav-links">
        <button onclick="showPage('home')" class="nav-btn active" id="btn-home">
          Home
        </button>
        <button
          onclick="showPage('projects')"
          class="nav-btn"
          id="btn-projects"
        >
          Projects
      </div>
    </nav>

    <div class="container">
      <section id="home" class="page-section">
        <div class="hero">
            <div class="hero-text">
                <h1 id="hero-name"></h1>
                <p id="hero-title"></p>
                <p id="hero-summary"></p>

                <div id="action-row" style="display: flex; gap: 15px; margin-top: 20px;"></div>
            </div>
            
            <img id="hero-img" class="profile-img" src="" alt="Profile">
        </div>

        <div class="section-divider" style="margin-top: 25px">
          <h2>Technical Expertise</h2>
        </div>
        <div id="tech-grid" class="grid tech-grid" style="gap: 20px"></div>

        <div class="section-divider" style="margin-top: 25px">
          <h2>Featured Projects</h2>
        </div>
        <div id="featured-grid" class="featured-grid"></div>

        <div class="section-divider" style="margin-top: 25px">
          <h2>Leadership & Production</h2>
        </div>
        <div id="management-grid" class="skills-grid"></div>
      </section>

      <section id="projects" class="page-section" style="display: none">
        <div class="section-divider">
          <h2>Shipped Titles</h2>
        </div>
        <div id="timeline-container"></div>
      </section>

      <section id="contact" class="page-section" style="display: none">
        <div class="section-divider">
          <h2>Let's build something great.</h2>
        </div>
        <div class="glass-card contact-card">
          <p id="contact-intro" class="muted-text"></p>

          <div class="contact-details muted-text" style="margin: 20px 0">
            <p>
              <strong>Location:</strong> <span id="contact-location"></span>
            </p>
            <p><strong>Phone:</strong> <span id="contact-phone"></span></p>
          </div>

          <div class="contact-links">
            <a id="btn-email" href="" class="action-btn">Email Me</a>
            <a id="btn-linkedin" href="" class="action-btn" target="_blank"
              >LinkedIn</a
            >
            <a id="btn-resume" href="" class="action-btn" download
              >Download Resume</a
            >
          </div>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
