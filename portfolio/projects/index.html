<!DOCTYPE html>
<html>
<head>

<title>Projects | Prakash Angappan</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="stylesheet" href="../assets/css/main.css">

<style>

/* ---------- PAGE ---------- */

body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-3;
}

.container{
max-width:1200px;
margin:auto;
padding:60px 20px;
}

/* ---------- TITLE ---------- */

h1{
text-align:center;
font-size:46px;
font-weight:800;
margin-bottom:70px;
color:#f2f2f2;
}

/* ---------- COMPANY HEADER ---------- */

.company{
margin-top:70px;
}

.company-header{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
border-bottom:2px solid rgba(255,255,255,0.15);
padding-bottom:10px;
margin-bottom:30px;
}

.company-header h2{
font-size:28px;
font-weight:800;
margin-bottom:6px;
color:#F5F5DC;
}

.company-meta{
font-size:16px;
opacity:0.85;
}

/* ---------- GRID ---------- */
.grid{
display:grid;
grid-template-columns:repeat(4,260px);
gap:30px;
justify-content:center;
}

/* center rows when fewer than 4 cards */
.grid{
display:grid;
grid-template-columns:repeat(4,260px);
gap:30px;
justify-content:center;
}

/* 1 project → center */
.grid .card:only-child{
grid-column:2 / span 2;
justify-self:center;
}

/* 2 projects → center */
.grid .card:nth-child(1):nth-last-child(2){
grid-column:2;
}

.grid .card:nth-child(2):last-child{
grid-column:3;
}

/* 3 projects → center */
.grid .card:nth-child(1):nth-last-child(3){
grid-column:1;
}

.grid .card:nth-child(2):nth-last-child(2){
grid-column:2;
}

.grid .card:nth-child(3):last-child{
grid-column:3;
}

/* 5 projects → last row 1 centered */
.grid .card:nth-child(5):last-child{
grid-column:2 / span 2;
justify-self:center;
}

/* 6 projects → last row 2 centered */
.grid .card:nth-child(5):nth-last-child(2){
grid-column:2;
}

.grid .card:nth-child(6):last-child{
grid-column:3;
}

/* 7 projects → last row 3 centered */
.grid .card:nth-child(5):nth-last-child(3){
grid-column:1;
}

.grid .card:nth-child(6):nth-last-child(2){
grid-column:2;
}

.grid .card:nth-child(7):last-child{
grid-column:3;
}
/* ---------- CARD ---------- */

.card{
width:260px;
background:#f3efe4;
border-radius:12px;
padding:14px;
text-align:center;
color:#1a1a1a;
box-shadow:0 8px 25px rgba(0,0,0,.35);
transition:transform .25s, box-shadow .25s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:
0 0 12px rgba(0,170,255,.8),
0 0 30px rgba(0,170,255,.4),
0 10px 30px rgba(0,0,0,.6);
}

/* ---------- THUMB ---------- */

.thumb{
position:relative;
background:#f7f2e6;
border-radius:8px;
padding:14px;
margin-bottom:10px;
}

.thumb img{
width:100%;
height:135px;
object-fit:contain;
}

/* ---------- BADGES (top-right corner) ---------- */

.badges{
position:absolute;
top:6px;
right:6px;
display:flex;
gap:4px;
flex-wrap:wrap;
}

.badges img{
width:38px;
height:38px;
background:white;
border-radius:6px;
padding:3px;
}

/* ---------- TITLE ---------- */

.project-title{
font-weight:700;
font-size:16px;
margin-top:6px;
color:#222;
}

/* ---------- DESCRIPTION ---------- */

.project-desc{
font-size:14px;
margin-top:6px;
font-weight:600;
}

.tasks{
font-size:13px;
margin-top:4px;
color:#555;
}

/* ---------- FOOTER ---------- */

.site-footer{
text-align:center;
margin-top:80px;
padding:40px 0;
font-size:14px;
color:#cfcfcf;
opacity:0.8;
}

.site-footer a{
color:#cfcfcf;
text-decoration:none;
}

.site-footer a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="page-bg"></div>
<div class="page-overlay"></div>

<div class="container">

<h1>Projects</h1>

<div id="projects"></div>

</div>

<footer class="site-footer">
© 2026 Prakash Angappan<br>
Design template from <a href="https://html5up.net" target="_blank">HTML5 UP</a>
</footer>

<script>

fetch("projects.json")
.then(res => res.json())
.then(data => {

const container=document.getElementById("projects")

data.companies.forEach(company=>{

let section=document.createElement("div")
section.className="company"

section.innerHTML=`
<div class="company-header">
<h2>${company.name}</h2>
<div class="company-meta">${company.role} • ${company.period}</div>
</div>
<div class="grid"></div>
`

const grid=section.querySelector(".grid")

company.projects.forEach(project=>{

let card=document.createElement("div")
card.className="card"

if(project.link){
card.style.cursor="pointer"
card.onclick=()=>window.open(project.link,"_blank")
}

let engineIcon = project.engine 
? `<img src="../images/icons/${project.engine}.png">`
: ""

let platformIcons = ""

if(project.platform){
project.platform.forEach(p=>{
platformIcons+=`<img src="../images/icons/${p}.png">`
})
}

card.innerHTML=`

<div class="thumb">

<div class="badges">
${engineIcon}
${platformIcons}
</div>

<img loading="lazy" src="../images/${project.image}">

</div>

<div class="project-title">${project.title}</div>

<div class="project-desc">${project.desc}</div>

<div class="tasks">${project.tasks}</div>

`

grid.appendChild(card)

})

container.appendChild(section)

})

})

</script>

</body>
</html>
