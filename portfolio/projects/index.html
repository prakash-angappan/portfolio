<!DOCTYPE html>
<html>
<head>

<title>Projects | Prakash Angappan</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#05070d">

<link rel="stylesheet" href="../assets/css/main.css">

<style>

/* ---------- PAGE ---------- */

body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
overflow-x:hidden;
}

/* ---------- CONTAINER (IVORY GLASS OVERLAY) ---------- */

.container{

width:92%;
max-width:1300px;

margin:auto;
/*margin-top:90px;
margin-bottom:60px;*/

padding:40px 60px;

position:relative;

background:rgba(255,255,240,0.08);

border-radius:22px;

backdrop-filter:blur(3px);

box-shadow:
0 0 40px rgba(0,0,0,.35),
0 0 120px rgba(0,0,0,.25);

text-align:center;

}

.container h1::after{
display:none;
}

.container::before{

content:"";
position:absolute;
inset:0;

border-radius:22px;

border:1px solid rgba(120,200,255,.22);

pointer-events:none;

}

/* ---------- NAV ---------- */

.top-nav{
position:fixed;
top:20px;
left:0;
width:100%;
display:flex;
justify-content:center;
z-index:100;
}

.nav-inner{
display:flex;
gap:30px;

padding:10px 28px;

border-radius:30px;

background:rgba(40,80,160,0.25);

backdrop-filter:blur(12px);

border:1px solid rgba(120,180,255,.35);

box-shadow:
0 0 10px rgba(120,180,255,.25),
0 0 20px rgba(60,120,255,.15);
}

.nav-inner a{
color:#F5F5DC;
text-decoration:none;
font-weight:600;
letter-spacing:.4px;
display:inline-block;
transition:transform .18s ease;
}

.nav-inner a::before,
.nav-inner a::after{
opacity:0;
color:#F5F5DC;
transition:opacity .18s ease;
}

.nav-inner a::before{content:"[";margin-right:4px;}
.nav-inner a::after{content:"]";margin-left:4px;}

.nav-inner a:hover{
transform:scale(1.08);
}

.nav-inner a:hover::before,
.nav-inner a:hover::after{
opacity:1;
}

.nav-inner a.active::before,
.nav-inner a.active::after{
opacity:1;
}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
z-index:-3;
}

/* ---------- AURORA ---------- */

.aurora-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:-2;

background:
radial-gradient(circle at 20% 30%, rgba(80,140,255,0.12), transparent 45%),
radial-gradient(circle at 80% 70%, rgba(120,200,255,0.10), transparent 45%),
radial-gradient(circle at 60% 20%, rgba(70,120,255,0.08), transparent 40%);

filter:blur(60px);

animation:auroraMove 28s ease-in-out infinite alternate;
}

@keyframes auroraMove{
0%{ transform:translate3d(-3%, -2%, 0) scale(1); }
50%{ transform:translate3d(3%, 2%, 0) scale(1.05); }
100%{ transform:translate3d(-2%, 3%, 0) scale(1.02); }
}

/* ---------- TITLE ---------- */

h1{
text-align:center;
font-size:46px;
font-weight:800;
margin-top:30px;
margin-bottom:20px;

color:#F5F5DC;

letter-spacing:2px;

text-shadow:
0 0 6px rgba(255,255,255,.25),
0 0 18px rgba(120,180,255,.25);
}

h1::after{
content:"";
display:block;
width:140px;
height:2px;
margin:18px auto 0;

background:linear-gradient(
90deg,
transparent,
rgba(120,180,255,.9),
transparent
);

box-shadow:
0 0 8px rgba(120,180,255,.7),
0 0 18px rgba(120,180,255,.4);
}

/* ---------- COMPANY ---------- */

.company{
margin-top:50px;
}

.company-header{
text-align:center;
padding-bottom:20px;
margin-bottom:40px;
position:relative;
}

.company-header h2{
font-size:28px;
color:#F5F5DC;
}

.company-meta{
opacity:.85;
}

.company-header::after{
content:"";
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:260px;
height:2px;

background:linear-gradient(
90deg,
transparent,
rgba(120,180,255,0.8),
transparent
);

box-shadow:
0 0 8px rgba(120,180,255,0.8),
0 0 20px rgba(120,180,255,0.4);
}

/* ---------- GRID ---------- */

.grid{

display:grid;

grid-template-columns:repeat(auto-fit,260px);

gap:26px;

justify-content:center;

}

/* ---------- CARD ---------- */

.card{

width:260px;

background:#f3efe4;

border-radius:12px;

padding:10px;

display:flex;
flex-direction:column;

text-align:center;
color:#1a1a1a;

box-shadow:0 10px 25px rgba(0,0,0,.35);

transition:transform .25s ease, box-shadow .25s ease;

}

.card:hover{
transform:translateY(-10px) scale(1.03);

box-shadow:
0 0 8px rgba(0,170,255,.8),
0 0 25px rgba(0,170,255,.45),
0 20px 40px rgba(0,0,0,.6);
}

/* ---------- THUMB ---------- */

.thumb{

position:relative;

border-radius:8px;

height:180px;

display:flex;
align-items:center;
justify-content:center;

background:linear-gradient(
180deg,
rgba(255,255,255,0.35),
rgba(255,255,255,0.12)
);

box-shadow:
inset 0 1px 3px rgba(255,255,255,.6),
inset 0 -3px 8px rgba(0,0,0,.15);

}

.thumb img{
max-width:100%;
max-height:170px;
object-fit:contain;
}

/* ---------- BADGES ---------- */

.badges{
position:absolute;
top:6px;
right:6px;
display:flex;
gap:4px;
}

.badges img{

width:32px;
height:32px;

background:white;

border-radius:6px;

object-fit:contain;

filter:
drop-shadow(0 0 2px rgba(255,255,255,0.8))
drop-shadow(0 0 6px rgba(120,180,255,0.8));

}

/* ---------- TEXT ---------- */

.project-title{
font-weight:700;
margin-top:6px;
min-height:40px;
}

.project-desc{
font-size:13px;
opacity:.75;
margin-top:6px;
}

.project-tasks{
font-size:14px;
color:#7ec7ff;
margin-top:8px;
font-weight:500;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width:900px){

.container{
padding:30px 20px;
}

.grid{
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
}

}

@media (max-width:600px){

.card{
width:95%;
}

h1{
font-size:36px;
}

}

</style>

</head>

<body>

<nav class="top-nav">
<div class="nav-inner">
<a href="/">Home</a>
<a href="/projects/" class="active">Featured Projects</a>
<a href="/about/">About Me</a>
</div>
</nav>

<div class="page-bg"></div>
<div class="page-overlay"></div>
<div class="aurora-bg"></div>

<div class="container">

<h1>Featured Projects</h1>

<div id="projects"></div>

</div>

<footer class="site-footer">
© 2026 Prakash Angappan • Base template: <a href="https://html5up.net" target="_blank">HTML5 UP</a>
</footer>

<script>

async function loadProjects(){

const res=await fetch("projects.json?v="+Date.now())
const data=await res.json()

const container=document.getElementById("projects")

data.companies.forEach(company=>{

const section=document.createElement("div")
section.className="company"

section.innerHTML=`
<div class="company-header">
<h2>${company.name}</h2>
<div class="company-meta">${company.role} • ${company.period}</div>
</div>
<div class="grid"></div>
`

const grid=section.querySelector(".grid")

company.projects.forEach(project=>{

const card=document.createElement("div")
card.className="card"

if(project.link){
card.style.cursor="pointer"
card.onclick=()=>window.open(project.link,"_blank")
}

let engineIcon=project.engine
? `<img loading="lazy" src="../images/icons/${project.engine}.png">`
: ""

let platformIcons=""

if(project.platform){
project.platform.forEach(p=>{
platformIcons+=`<img loading="lazy" src="../images/icons/${p}.png">`
})
}

card.innerHTML=`

<div class="thumb">

<div class="badges">
${engineIcon}
${platformIcons}
</div>

<img loading="lazy" src="../images/${project.image}">

</div>

<div class="project-title">${project.title}</div>
<div class="project-desc">${project.desc}</div>
<div class="project-tasks">${project.tasks}</div>

`

grid.appendChild(card)

})

container.appendChild(section)

})

}

loadProjects()

</script>

</body>
</html>
