<!DOCTYPE html>
<html>
<head>

<title>Projects | Prakash Angappan</title>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#05070d">

<link rel="stylesheet" href="../assets/css/main.css">

<style>

/* ---------- PAGE ---------- */

body{
font-family:Arial, Helvetica, sans-serif;
color:#e8e8e8;
margin:0;
overflow-x:hidden;
}

/* ---------- BACKGROUND ---------- */

.page-bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("../images/projects-bg.png") center/cover no-repeat;
z-index:-4;
transform:translateZ(0);
}

.page-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:-3;
}

/* ---------- LIGHT SWEEP ---------- */

.light-sweep,
.light-sweep2{
position:fixed;
top:0;
left:-150%;
width:300%;
height:100%;
pointer-events:none;
z-index:-2;
will-change:transform;
transform:translate3d(0,0,0);
}

.light-sweep{
background:linear-gradient(
110deg,
transparent 46%,
rgba(120,180,255,0.08) 48%,
rgba(120,180,255,0.25) 50%,
rgba(120,180,255,0.08) 52%,
transparent 54%
);
animation:lightSweep 10s linear infinite;
}

.light-sweep2{
background:linear-gradient(
110deg,
transparent 47%,
rgba(120,200,255,0.06) 49%,
rgba(120,200,255,0.15) 50%,
rgba(120,200,255,0.06) 51%,
transparent 53%
);
animation:lightSweep2 16s linear infinite;
}

@keyframes lightSweep{
0%{ transform:translate3d(0,0,0); }
100%{ transform:translate3d(100%,0,0); }
}

@keyframes lightSweep2{
0%{ transform:translate3d(-20%,0,0); }
100%{ transform:translate3d(120%,0,0); }
}

/* ---------- CONTAINER ---------- */

.container{
max-width:1200px;
margin:auto;
padding:60px 20px;
box-sizing:border-box;
}

/* ---------- TITLE ---------- */

h1{
text-align:center;
font-size:46px;
font-weight:800;
margin-bottom:70px;
color:#f2f2f2;
}

/* ---------- COMPANY ---------- */

.company{
margin-top:70px;
}

.company-header{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
border-bottom:2px solid rgba(255,255,255,0.15);
padding-bottom:10px;
margin-bottom:30px;
}

.company-header h2{
font-size:28px;
font-weight:800;
margin-bottom:6px;
color:#F5F5DC;
}

.company-meta{
font-size:16px;
opacity:0.85;
}

/* ---------- GRID ---------- */

.grid{
display:grid;
grid-template-columns:repeat(4,260px);
gap:30px;
justify-content:center;
}

/* ---------- CARD ---------- */

.card{
width:260px;
background:#f3efe4;
border-radius:12px;
padding:14px;
text-align:center;
color:#1a1a1a;
box-shadow:0 8px 25px rgba(0,0,0,.35);
transition:transform .25s, box-shadow .25s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:
0 0 12px rgba(0,170,255,.8),
0 0 30px rgba(0,170,255,.4),
0 10px 30px rgba(0,0,0,.6);
}

/* ---------- THUMB ---------- */

.thumb{
position:relative;
background:#f7f2e6;
border-radius:8px;
padding:14px;
margin-bottom:10px;
}

.thumb img{
width:100%;
height:135px;
object-fit:contain;
}

/* ---------- BADGES ---------- */

.badges{
position:absolute;
top:6px;
right:6px;
display:flex;
gap:4px;
flex-wrap:wrap;
}

.badges img{
width:38px;
height:38px;
background:white;
border-radius:6px;
padding:3px;
}

/* ---------- TEXT ---------- */

.project-title{
font-weight:700;
font-size:16px;
margin-top:6px;
color:#222;
}

.project-desc{
font-size:14px;
margin-top:6px;
font-weight:600;
}

.tasks{
font-size:13px;
margin-top:4px;
color:#555;
}

/* ---------- RESPONSIVE ---------- */

@media (max-width:1100px){
.grid{ grid-template-columns:repeat(3,260px); }
}

@media (max-width:800px){
.grid{ grid-template-columns:repeat(2,260px); }
}

@media (max-width:600px){

.grid{
grid-template-columns:1fr;
justify-items:center;
}

.card{
width:90%;
}

}

/* ---------- FOOTER ---------- */

.site-footer{
text-align:center;
margin-top:80px;
padding:40px 0;
font-size:14px;
color:#cfcfcf;
opacity:0.8;
}

.site-footer a{
color:#cfcfcf;
text-decoration:none;
}

.site-footer a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="page-bg"></div>
<div class="page-overlay"></div>

<div class="light-sweep"></div>
<div class="light-sweep2"></div>

<div class="container">

<h1>Projects</h1>

<div id="projects"></div>

</div>

<footer class="site-footer">
© 2026 Prakash Angappan<br>
Design template from <a href="https://html5up.net" target="_blank">HTML5 UP</a>
</footer>

<script>

function centerCards(grid){

/* only run for desktop */

if(window.innerWidth < 1000){
return
}

const cards=[...grid.children]
const count=cards.length

/* PERFECT CENTER FOR SMALL COUNTS */

if(count<=3){

grid.style.gridTemplateColumns=`repeat(${count},260px)`
grid.style.justifyContent="center"

return
}

/* DESKTOP GRID */

grid.style.gridTemplateColumns="repeat(4,260px)"

const remainder=count % 4

if(remainder===1){
cards[count-1].style.gridColumn="2 / span 2"
}

if(remainder===2){
cards[count-2].style.gridColumn="2"
cards[count-1].style.gridColumn="3"
}

if(remainder===3){
cards[count-3].style.gridColumn="1"
cards[count-2].style.gridColumn="2"
cards[count-1].style.gridColumn="3"
}

}

async function loadProjects(){

const res=await fetch("projects.json")
const data=await res.json()

const container=document.getElementById("projects")
const fragment=document.createDocumentFragment()

data.companies.forEach(company=>{

const section=document.createElement("div")
section.className="company"

section.innerHTML=`
<div class="company-header">
<h2>${company.name}</h2>
<div class="company-meta">${company.role} • ${company.period}</div>
</div>
<div class="grid"></div>
`

const grid=section.querySelector(".grid")

company.projects.forEach(project=>{

const card=document.createElement("div")
card.className="card"

if(project.link){
card.style.cursor="pointer"
card.onclick=()=>window.open(project.link,"_blank")
}

let engineIcon=project.engine
? `<img src="../images/icons/${project.engine}.png">`
: ""

let platformIcons=""

if(project.platform){
project.platform.forEach(p=>{
platformIcons+=`<img src="../images/icons/${p}.png">`
})
}

card.innerHTML=`

<div class="thumb">

<div class="badges">
${engineIcon}
${platformIcons}
</div>

<img loading="lazy" src="../images/${project.image}">

</div>

<div class="project-title">${project.title}</div>

<div class="project-desc">${project.desc}</div>

<div class="tasks">${project.tasks}</div>

`

grid.appendChild(card)

})

centerCards(grid)

fragment.appendChild(section)

})

container.appendChild(fragment)

}

loadProjects()

</script>

</body>
</html>
